<script type="application/ld+json">
  {
    "@context": "http://schema.org",
    "@type": "Person",
    "name": "Guillaume Meunier",
    "url": "https://guillaume-meunier.fr",
    "sameAs": [
      "https://twitter.com/{{ site.social-username.twitter }}",
      "https://instagram.com/{{ site.social-username.instagram }}",
      "https://linkedin.com/in/{{ site.social-username.linkedin }}",
      "https://medium.com/{{ site.social-username.medium }}"
    ]
  }
</script>

<header class="main-header sticky-header" data-header>
  <div class="header-content">

    <a class="accessibility-skip" href="#maincontent">Skip to main content</a>

    <div class="logo-nav-wrapper">
      <div class="logo-title-wrapper">
        <div class="logo">
          <a href="{{ site.baseurl }}/" aria-label="Acceuil Guillaume Meunier">
            {% include logo.svg %}
          </a>
        </div>
      </div>

      <nav class="navigation" aria-label="main navigation">
        <a href="javascript:void(0)" class="mobile-nav">Menu</a>
        <div class="mobile-nav-wrapper">
          <ul class="mobile-dropdown" itemscope itemtype="http://schema.org/SiteNavigationElement">
          {% for link in site.navigation %}
            {% comment %} Pas de marque « page en cours » : seul le survol met le titre en évidence.
               data-titre sert à réserver la largeur du gras (voir _nav.scss) {% endcomment %}
            <li>
              <a itemprop="url" href="{{ link.url }}" data-titre="{{ link.title }}"><span itemprop="name">{{ link.title }}</span></a>
            </li>
          {% endfor %}
          </ul>
        </div>
      </nav>

    </div>

  </div>
</header>
